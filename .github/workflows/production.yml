name: Validate and deploy homepage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx wrangler deploy --config wrangler.json --dry-run --outdir .wrangler/dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm test
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: b1aa310aa0a1638d72b8b086a21e557c
      SITE_URL: https://aismallbizguru-site.hmarquardt.workers.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Require the existing account-owned Workers deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Missing CLOUDFLARE_API_TOKEN. Add the existing account-owned Workers deployment credential to this repository; do not copy a rotating Wrangler OAuth login.'
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Publish validated source to Cloudflare Static Assets
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the Cloudflare-hosted revision over HTTPS
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          verification_dir=$(mktemp -d)
          headers="$verification_dir/headers.txt"
          body="$verification_dir/version.json"
          url="${SITE_URL%/}/version.json?revision=$EXPECTED_COMMIT"
          for attempt in {1..12}; do
            : > "$headers"
            : > "$body"
            if status=$(curl --silent --show-error --proto '=https' \
              --connect-timeout 10 --max-time 20 \
              --user-agent 'aismallbizguru-ci-verifier/1.0' \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' \
              --dump-header "$headers" --output "$body" \
              --write-out '%{http_code}' "$url"); then
              curl_exit=0
            else
              curl_exit=$?
            fi
            if [[ "$curl_exit" -eq 0 && "$status" == "200" ]]; then
              if python3 - "$body" "$EXPECTED_COMMIT" <<'PY'
          import json, sys
          with open(sys.argv[1]) as response:
              actual = json.load(response).get('commit')
          if actual != sys.argv[2]:
              raise SystemExit(f"Revision mismatch: expected {sys.argv[2]}, received {actual!r}")
          PY
              then
                echo "Cloudflare HTTPS revision matches $EXPECTED_COMMIT (HTTP $status)"
                exit 0
              fi
            fi
            echo "::warning::Verification attempt $attempt/12 failed: HTTP $status, curl exit $curl_exit"
            echo "Response headers:"
            cat "$headers"
            ray_id=$(awk 'tolower($1) == "cf-ray:" {gsub("\r", "", $2); print $2}' "$headers")
            echo "Cloudflare Ray ID: ${ray_id:-not provided}"
            echo "Response body (first 1024 bytes):"
            head -c 1024 "$body"
            echo
            if (( attempt < 12 )); then sleep 10; fi
          done
          echo '::error::Cloudflare HTTPS revision verification failed after 12 attempts.'
          exit 1
