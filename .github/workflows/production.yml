name: Validate and deploy homepage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx wrangler deploy --config wrangler.json --dry-run --outdir .wrangler/dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm test
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: b1aa310aa0a1638d72b8b086a21e557c
      SITE_URL: https://aismallbizguru-site.hmarquardt.workers.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Require the existing account-owned Workers deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Missing CLOUDFLARE_API_TOKEN. Add the existing account-owned Workers deployment credential to this repository; do not copy a rotating Wrangler OAuth login.'
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Publish validated source to Cloudflare Static Assets
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the Cloudflare-hosted revision over HTTPS
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = os.environ['SITE_URL'].rstrip('/') + '/version.json'
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url + '?revision=' + os.environ['EXPECTED_COMMIT'], timeout=15) as response:
                      assert response.status == 200
                      assert json.load(response)['commit'] == os.environ['EXPECTED_COMMIT']
                  print('Cloudflare HTTPS revision matches', os.environ['EXPECTED_COMMIT'])
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(10)
          PY
